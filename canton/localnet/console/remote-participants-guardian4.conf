# Canton console config: the three LocalNet participants plus the temporary guardian4 participant.
# LEDGER_API_TOKEN: optional Ledger API token for console ledger_api commands (token.sh wormhole-script).
canton {
  remote-participants {
    guardian4 {
      admin-api { address = "127.0.0.1", port = 5902 }
      ledger-api { address = "127.0.0.1", port = 5901 }
      token = ${?LEDGER_API_TOKEN}
    }
    sv {
      admin-api { address = "127.0.0.1", port = 4902 }
      ledger-api { address = "127.0.0.1", port = 4901 }
      token = ${?LEDGER_API_TOKEN}
    }
    app-provider {
      admin-api { address = "127.0.0.1", port = 3902 }
      ledger-api { address = "127.0.0.1", port = 3901 }
      token = ${?LEDGER_API_TOKEN}
    }
    app-user {
      admin-api { address = "127.0.0.1", port = 2902 }
      ledger-api { address = "127.0.0.1", port = 2901 }
      token = ${?LEDGER_API_TOKEN}
    }
  }
  features.enable-preview-commands = yes
  features.enable-testing-commands = yes
  features.enable-repair-commands = yes
}
