# Temporary fourth participant for the hosting-change rehearsals (L1, L5). Its PostgreSQL runs in the guardian4-postgres
# container with tmpfs storage: state ends with the containers. ACS import needs database storage.
canton {
  features {
    enable-preview-commands = yes
    enable-testing-commands = yes
    enable-repair-commands = yes
  }
  parameters.non-standard-config = yes
  participants.guardian4 {
    storage {
      type = postgres
      config {
        dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
        properties = {
          serverName = "guardian4-postgres"
          portNumber = 5432
          databaseName = "guardian4"
          user = "guardian4"
          password = "guardian4"
        }
      }
      parameters.migrate-and-start = true
    }
    admin-api { address = "0.0.0.0", port = 5902 }
    ledger-api {
      address = "0.0.0.0"
      port = 5901
      auth-services = [{
        type = unsafe-jwt-hmac-256
        target-audience = "https://canton.network.global"
        secret = "unsafe"
      }]
      user-management-service.additional-admin-user-id = "ledger-api-user"
      max-token-lifetime = Inf
      interactive-submission-service.enable-verbose-hashing = true
    }
    http-ledger-api { address = "0.0.0.0", port = 5975 }
  }
}
