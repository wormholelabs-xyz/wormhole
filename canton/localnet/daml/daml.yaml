# LocalNet smoke script: bootstrap the core bridge, publish two messages, verify one VAA.
# Party hints carry a run label, so the script can run again on the same participant.
sdk-version: 3.7.3
name: wormhole-localnet-smoke
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
build-options:
  - --target=2.3
data-dependencies:
  - ../../core/.daml/dist/wormhole-core-0.9.0.dar
  - ../../test/.daml/dist/wormhole-core-test-0.1.0.dar
  - ../../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../../dars/splice-api-token-allocation-v1-1.0.0.dar
