# Native Token Transfers (NTT) package: the NttManager + Wormhole transceiver on
# Canton, built on top of the wormhole-core primitives (publish via Emitter,
# parse/verify VAAs). Templates only — no daml-script — so this is uploadable to
# a participant like wormhole-core.
#
# It references wormhole-core as a data-dependency (the built core DAR); the root
# multi-package.yaml builds core first. The CIP-56 token-standard interfaces are
# integrated via a separate package (see ../ntt-cip56) so this package builds with
# only the core DAR + stdlib (the NttToken seam abstracts the token).
sdk-version: 3.5.1
name: wormhole-ntt
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
build-options:
  # Daml-LF 2.3 (Protocol Version 35), matching wormhole-core.
  - --target=2.3
data-dependencies:
  - ../core/.daml/dist/wormhole-core-0.2.0.dar
  - ../ntt-token/.daml/dist/wormhole-ntt-token-0.1.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-v1-1.0.0.dar
