# Production Wormhole core-bridge package: templates only, NO daml-script.
# This is the DAR uploaded to a participant / shipped to integrators.
#
# SDK and protocol target: Daml SDK 3.7.3, Canton 3.7.3, Protocol Version 37 —
# Ledger API v2 and the DA.Crypto.Text builtins used by Wormhole.Core.VAA.
# `--target=2.3` selects Daml-LF 2.3, which Protocol Versions 36 and 37 accept. Contract keys are non-unique on LF 2.3, so identity uniqueness
# is registry-enforced (see State.daml and README §4).
sdk-version: 3.7.3
name: wormhole-core
version: 0.9.0
source: daml
# 0.9.0 is not SCU-compatible with 0.8.x (template fields removed); participants need a fresh wormhole-core line.
dependencies:
  - daml-prim
  - daml-stdlib
# CIP-0056 token-standard interface DARs, vendored verbatim from a Splice
# release bundle (provenance + hashes in ../dars/README.md). Listed
# explicitly — don't rely on transitive module exposure. Built --target=2.1;
# a 2.3 package may data-depend on lower LF 2.x.
data-dependencies:
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-v1-1.0.0.dar
build-options:
  # Daml-LF 2.3: the SDK 3.7.3 default target. The DA.Crypto.Text builtins
  # (keccak256 / secp256k1WithEcdsaOnly) are stable on it.
  - --target=2.3
