# Multi-package project: the production `wormhole-core` package (templates only),
# the uploadable NTT package set built on top of it (`ntt-token`, `ntt`,
# `ntt-cip56`), and a separate `wormhole-core-test` package (Daml Scripts).
# Splitting keeps daml-script — and the test code — out of the production DARs
# that get uploaded to a participant. `dpm build --all` builds in dependency
# order: core, then the NTT packages, then test (which data-depends on them).
packages:
  - ./core
  - ./ntt-token
  - ./ntt
  - ./ntt-cip56
  - ./test
