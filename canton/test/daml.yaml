# Test/devnet package: Daml Scripts that exercise the wormhole-core templates
# (unit tests via `dpm test`, and the devnet setup / integration entrypoints).
# Kept separate from the production package so daml-script stays out of the
# wormhole-core DAR.
#
# It references wormhole-core as a data-dependency (the built core DAR). The
# root multi-package.yaml ensures core is built first. `dpm build --all` packs
# core's DALFs into this DAR too, so uploading it to a devnet sandbox makes the
# core package available there.
sdk-version: 3.4.11
name: wormhole-core-test
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../core/.daml/dist/wormhole-core-0.1.0.dar
