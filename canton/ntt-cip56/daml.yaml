# CIP-56 (Canton Network Token Standard) implementations of the NttToken seam,
# built against the vendored token-standard interface DARs. Works for Canton Coin
# (Amulet) or any conforming token.
#
# The token-standard interface DARs live under ../dars (shared with the core
# fee payments); see ../dars/README.md for provenance and package-id vetting.
sdk-version: 3.5.1
name: wormhole-ntt-cip56
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
build-options:
  # Daml-LF 2.3 (Protocol Version 35), matching wormhole-core.
  - --target=2.3
data-dependencies:
  - ../ntt-token/.daml/dist/wormhole-ntt-token-0.1.0.dar
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - ../dars/splice-api-token-burn-mint-v1-1.0.0.dar
