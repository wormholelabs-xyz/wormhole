# CIP-56 (Canton Network Token Standard) implementations of the NttToken seam,
# built against the vendored token-standard interface DARs. Works for Canton Coin
# (Amulet) or any conforming token.
#
# The DARs under ../vendor/token-standard are vendored from
# github.com/digital-asset/cn-quickstart (quickstart/daml/dars), the same way
# that repo's licensing app pins them; see ../vendor/token-standard/README.md.
sdk-version: 3.4.11
name: wormhole-ntt-cip56
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - ../ntt-token/.daml/dist/wormhole-ntt-token-0.1.0.dar
  - ../vendor/token-standard/splice-api-token-metadata-v1-1.0.0.dar
  - ../vendor/token-standard/splice-api-token-holding-v1-1.0.0.dar
  - ../vendor/token-standard/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - ../vendor/token-standard/splice-api-token-burn-mint-v1-1.0.0.dar
