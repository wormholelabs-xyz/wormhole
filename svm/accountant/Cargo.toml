[workspace]
members = [
    "crates/*",
    "programs/*",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wormhole-foundation/wormhole"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
bytemuck = { version = "1.21", features = ["derive", "min_const_generics"] }
# Pinned exactly per the CLAUDE.md supply-chain rule: this is the framework
# migration target (pinocchio -> anchor-lang 1.x), so the version is load-
# bearing, not just a floor. `anchor-lang` 1.1.2 pulls solana-* 3.x, which is
# what makes this line unify cleanly with the existing mollusk/surfpool test
# stack (already on solana-* 3.x) — see the migration plan §0.
anchor-lang = "=1.1.2"
# `AnchorDeserialize`/`AnchorSerialize` are re-exports of `borsh`'s own
# `BorshDeserialize`/`BorshSerialize` traits (anchor-lang 1.1.2 pins
# `borsh = "1.5.7"`). Pinned to the exact version anchor's own graph resolves
# to (verified via `cargo tree`) so there is exactly one `borsh` in the graph.
# Needed directly (not just transitively) so `instructions::raw_ix_data`
# can implement these traits by hand for the raw-bytes instruction-argument
# wrapper described there.
borsh = "=1.5.7"
# On-chain `secp256k1_recover` for the `submit_observations` guardian-signature
# check (`quorum::verify_signature`). Unlike pinocchio's raw syscall (which
# only works on-chain, needing a host `unreachable!()` stub), this crate has a
# real host-side implementation (via `k256`) gated on `target_os`, so no
# cfg-gated stub is needed on our side. Pinned exact per the supply-chain rule.
solana-secp256k1-recover = "=3.2.0"
global-accountant-definitions = { path = "crates/definitions" }
accountant-operational-core = { path = "crates/operational-core" }
accountant-test-fixtures = { path = "crates/test-fixtures" }
# Compile-time base58 decoding for external program IDs. `no_std`, two const
# hashing deps. Same version the in-tree `wormhole-svm-definitions` crate uses.
const-crypto = "=0.3.0"
# Canonical in-tree program IDs. Dev-only: it pins `solana-program <=2`, so it
# adds a second solana tree to the test build. Do not promote to a dependency.
# Canonical governance wire format (`sdk/rust`). Dev-only, host deps only.
wormhole-vaas-serde = { path = "../../sdk/rust/vaas-serde" }
serde_wormhole = { path = "../../sdk/rust/serde_wormhole" }
# NoReplay program crate. Dev-only parity checks for the wire constants and PDA
# seeds; pulls `pinocchio`, so it must stay out of the SBF build. Pinned to a
# commit on `main`.
solana-noreplay = { git = "ssh://git@github.com/wormholelabs-xyz/solana-noreplay.git", rev = "e4bad6a1c890411346fc27f17baae6ae2decd507" }
# `solana-noreplay` re-exports pinocchio's `Address`; its host-side
# `find_program_address` needs this feature, enabled here explicitly rather
# than by accidental unification with another crate's graph.
solana-address = { version = "=2.6.0", default-features = false, features = ["curve25519"] }
# 256-bit unsigned integer primitive backing `Uint256`. Pinned exact per the
# supply-chain rule in CLAUDE.md; `default-features = false` is required so
# the crate compiles on the SBF target (no `std`). We only consume
# `checked_add`/`checked_sub` plus the `to_be_bytes` / `from_be_bytes`
# conversions, so the deactivated features stay deactivated.
ruint = { version = "=1.17.2", default-features = false }
# Shim instruction builders; dev-only parity check for `VerifyHashData`.
wormhole-svm-shim = { path = "../wormhole-core-shims/crates/shim" }
solana-program = "=2.3.0"
wormhole-svm-definitions = { path = "../wormhole-core-shims/crates/definitions", features = ["solana", "verify-vaa-shim"] }

# Test-only dependencies. Kept in workspace so versions stay aligned.
mollusk-svm = "0.12.1-agave-4.0"
solana-account = "3.4"
solana-instruction = "3.2"
solana-pubkey = "4.1"
# Surfpool E2E tests — talk to a subprocess `surfpool start` over JSON-RPC.
# Versions chosen to unify with mollusk's solana-* 3.x set: surfpool v1.2.1
# reports `solana-core: 3.1.10` in `getVersion`, so the 3.1 client matches the
# simnet wire protocol exactly.
solana-client = "3.1"
solana-keypair = "3.0"
solana-signer = "3.0"
solana-transaction = "3.0"
solana-commitment-config = "3.1"
solana-system-interface = "3.2"
serde_json = "1"
# Keccak256 used by the `submit_observations` tests to recompute the
# double-hashed body digest (`keccak(keccak(body))`) for synthetic VAAs. The
# `sha3` feature enables the host-side implementation; without it the off-chain
# `hashv` panics.
solana-keccak-hasher = { version = "3.1", features = ["sha3"] }

[profile.release]
overflow-checks = false
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
eq_op = "warn"
modulo_one = "warn"
out_of_bounds_indexing = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
undocumented_unsafe_blocks = "warn"
unchecked_duration_subtraction = "warn"
panicking_overflow_checks = "warn"
if_let_mutex = "warn"
or_fun_call = "warn"
set_contains_or_insert = "warn"
stable_sort_primitive = "warn"
suspicious_operation_groupings = "warn"
iter_over_hash_type = "warn"
non_send_fields_in_send_ty = "warn"
