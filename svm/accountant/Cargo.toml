[workspace]
members = [
    "crates/*",
    "programs/*",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wormhole-foundation/wormhole"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
bytemuck = { version = "1.21", features = ["derive", "min_const_generics"] }
pinocchio = { version = "0.11", features = ["cpi"] }
pinocchio-system = "0.6"
global-accountant-definitions = { path = "crates/definitions" }
# 256-bit unsigned integer primitive backing `Uint256`. Pinned exact per the
# supply-chain rule in CLAUDE.md; `default-features = false` is required so
# the crate compiles on the SBF target (no `std`). We only consume
# `checked_add`/`checked_sub` plus the `to_be_bytes` / `from_be_bytes`
# conversions, so the deactivated features stay deactivated.
ruint = { version = "=1.17.2", default-features = false }

# Test-only dependencies. Kept in workspace so versions stay aligned.
mollusk-svm = "0.12.1-agave-4.0"
solana-account = "3.4"
solana-instruction = "3.2"
solana-pubkey = "4.1"
# Surfpool E2E spike (see `tests/surfpool_e2e_spike.rs`). Versions chosen to
# unify with mollusk's solana-* 3.x set: surfpool v1.2.1 reports
# `solana-core: 3.1.10` in `getVersion`, so the 3.1 client matches the simnet
# wire protocol exactly.
solana-client = "3.1"
solana-keypair = "3.0"
solana-signer = "3.0"
solana-transaction = "3.0"
solana-commitment-config = "3.1"
solana-system-interface = "3.2"
# Rent constants exposed to host-side integration tests so they can derive the
# rent-exempt minimum from `BalanceAccountLayout::LEN` instead of hardcoding it.
# Aligned with mollusk's transitive 3.0 to avoid pulling in two versions.
solana-rent = "3.0"
# Keccak256 used by the VAA-fixture loader to recompute the double-hashed
# body digest (`keccak(keccak(body))`). Matches the rest of the `solana-*`
# 3.x dev-dep stack. The `sha3` feature enables the host-side implementation;
# without it the off-chain `hashv` panics.
solana-keccak-hasher = { version = "3.1", features = ["sha3"] }
serde_json = "1"

[profile.release]
overflow-checks = false
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
eq_op = "warn"
modulo_one = "warn"
out_of_bounds_indexing = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
undocumented_unsafe_blocks = "warn"
unchecked_duration_subtraction = "warn"
panicking_overflow_checks = "warn"
if_let_mutex = "warn"
or_fun_call = "warn"
set_contains_or_insert = "warn"
stable_sort_primitive = "warn"
suspicious_operation_groupings = "warn"
iter_over_hash_type = "warn"
non_send_fields_in_send_ty = "warn"
