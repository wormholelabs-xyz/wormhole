[package]
name = "accountant-operational-core"
description = "Shared, program-ID-agnostic operational handlers (quorum tracker, signed-VAA backfill, pending cleanup) and the supporting state/hash machinery for the global accountant. The token-payload parse and balance mutation are injected by the consuming program via a callback, so the same core backs both the WTT and NTT operational programs."
publish = false

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
bytemuck.workspace = true
global-accountant-definitions.workspace = true
pinocchio.workspace = true
pinocchio-system.workspace = true

[lints]
workspace = true
