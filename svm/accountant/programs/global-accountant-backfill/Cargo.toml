[package]
name = "global-accountant-backfill"
description = "Wormhole Global Accountant backfill program — one-shot migration `.so` that seeds NoReplay bits, Balance PDAs, ModifyBalance records and ChainRegistration state from a wormchain snapshot, then is upgraded out via `solana program upgrade`."
publish = false

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Anchor convention (inverted polarity from the old `bpf-entrypoint` opt-in):
# the entrypoint is present by default; `no-entrypoint` suppresses it for
# library/CPI/test consumption. `idl-build` is deliberately never enabled —
# Anchor's auto-IDL would be partial/inaccurate for the custom offset-0 tag
# + bytemuck layouts this program keeps, so IDL codegen stays off rather than
# shipping a misleading artifact.
default = []
no-entrypoint = []

[dependencies]
accountant-backfill-core.workspace = true
accountant-operational-core.workspace = true
anchor-lang.workspace = true
borsh.workspace = true
const-crypto.workspace = true
global-accountant-definitions.workspace = true

[dev-dependencies]
accountant-test-harness.workspace = true
mollusk-svm.workspace = true
solana-account.workspace = true
solana-instruction.workspace = true
solana-pubkey = { workspace = true, features = ["curve25519"] }
global-accountant-backfill = { path = ".", features = ["no-entrypoint"] }
bytemuck.workspace = true
# Surfpool e2e: RPC client, signing keys, and the catalogue reader behind the cost probes.
solana-client.workspace = true
solana-commitment-config.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true
solana-signature = "=3.4.1"
serde_json.workspace = true
# `Rent::default().minimum_balance`, to pin each written PDA at the rent-exempt minimum.
solana-rent = "=3.1.0"
# Bounded-concurrency sends in the at-scale cost probe. Already in the lock graph
# via `solana-client`.
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "sync"] }

[lints]
workspace = true
