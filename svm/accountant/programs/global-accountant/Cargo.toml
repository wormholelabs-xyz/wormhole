[package]
name = "global-accountant"
description = "Wormhole Global Accountant Solana program (Anchor)."
publish = false

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Anchor convention (inverted polarity from the old `bpf-entrypoint` opt-in):
# the entrypoint is present by default; `no-entrypoint` suppresses it for
# library/CPI/test consumption. `idl-build` is deliberately never enabled —
# Anchor's auto-IDL would be partial/inaccurate for the custom offset-0 tag
# + bytemuck layouts this program keeps (migration plan §7.7), so IDL codegen
# stays off rather than shipping a misleading artifact.
default = []
no-entrypoint = []

[dependencies]
accountant-operational-core.workspace = true
anchor-lang.workspace = true
bytemuck.workspace = true
global-accountant-definitions.workspace = true

[[bench]]
name = "compute_units"
harness = false

[dev-dependencies]
accountant-test-fixtures.workspace = true
accountant-test-harness.workspace = true
wormhole-svm-definitions.workspace = true
mollusk-svm.workspace = true
mollusk-svm-bencher.workspace = true
solana-account.workspace = true
solana-instruction.workspace = true
solana-keccak-hasher.workspace = true
solana-pubkey = { workspace = true, features = ["curve25519"] }
global-accountant = { path = ".", features = ["no-entrypoint"] }
# Surfpool e2e: talks to a subprocess `surfpool start` over JSON-RPC.
solana-client.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true
solana-transaction.workspace = true
solana-commitment-config.workspace = true
solana-system-interface.workspace = true
serde_json.workspace = true
# `ProgramResult::Failure` carries a `solana_program_error::ProgramError`; tests
# name it to assert builtin error codes (e.g. `InvalidAccountData`) via the full
# `u64` encoding.
solana-program-error = "=3.0.1"

[lints]
workspace = true
