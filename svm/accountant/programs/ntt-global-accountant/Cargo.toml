[package]
name = "ntt-global-accountant"
description = "Wormhole NTT Global Accountant Solana program (Pinocchio)."
publish = false

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Build the BPF entrypoint. Disabled when consumed as a library (e.g. by tests
# or client tooling).
default = []
bpf-entrypoint = []

[dependencies]
accountant-operational-core.workspace = true
bytemuck.workspace = true
global-accountant-definitions.workspace = true
pinocchio.workspace = true
pinocchio-system.workspace = true
# Force-enable the `curve25519` feature on solana-address so production-shape
# host builds (cargo clippy without test features) can resolve
# `Address::find_program_address`. Same rationale as the WTT program crate.
solana-address = { version = "2.6", features = ["curve25519"] }

[dev-dependencies]
mollusk-svm.workspace = true
solana-account.workspace = true
solana-instruction.workspace = true
solana-pubkey = { workspace = true, features = ["curve25519"] }
# Pull `curve25519` into the unified feature set so the host build of this
# crate can resolve `Address::find_program_address`. On-chain the syscall path
# is unconditionally available; this is purely for `cargo test`.
solana-address = { version = "2.6", features = ["curve25519"] }
ntt-global-accountant = { path = "." }
# Pure-Rust secp256k1. Tests sign synthetic guardian observations to populate
# the GuardianSignatures fixtures the real Verify VAA Shim CPI verifies against.
libsecp256k1 = "0.6"
# Keccak256 used host-side to recompute the double-hashed VAA body digest.
solana-keccak-hasher.workspace = true
# Hash-pinned `.so` fixtures live under `tests/fixtures/`. The mollusk test
# harness verifies each fixture's SHA-256 against a hard-coded constant before
# loading; drift surfaces as a panic with the recompute-and-update recipe.
sha2 = "=0.10.9"
# Loads the mainnet-vector corpus (`tests/fixtures/ntt_test_vectors.json`)
# consumed by `tests/test_vectors.rs`. Already pinned in the workspace lockfile.
serde_json.workspace = true
# Surfpool E2E lifecycle test — talks to a subprocess `surfpool start` over
# JSON-RPC. Mirrors the WTT `global-accountant` crate's dev-dependency set.
solana-client.workspace = true
solana-keypair.workspace = true
solana-signer.workspace = true
solana-transaction.workspace = true
solana-commitment-config.workspace = true
solana-system-interface.workspace = true

[lints]
workspace = true
