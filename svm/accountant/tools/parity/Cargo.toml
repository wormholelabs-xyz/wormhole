[package]
name = "svm-accountant-parity"
version = "0.1.0"
edition = "2021"
publish = false
description = "Wormchain ↔ SVM accountant parity checker: compares balances and replay marks between a snapshot and the deployed program, with a JSONL ledger of every check."

[lib]
name = "svm_accountant_parity"
path = "src/lib.rs"

[[bin]]
name = "svm-accountant-parity"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
solana-commitment-config.workspace = true
solana-pubkey.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

svm-accountant-tools-common.workspace = true
global-accountant-definitions.workspace = true

[dev-dependencies]
bytemuck.workspace = true
svm-accountant-tools-common = { workspace = true, features = ["test-support"] }
solana-client.workspace = true
solana-commitment-config.workspace = true
tempfile.workspace = true
