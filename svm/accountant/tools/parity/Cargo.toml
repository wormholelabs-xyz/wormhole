[workspace]
# Standalone workspace — keeps deps isolated from the parent SBF workspace
# (mirrors `tools/backfill/`).

[package]
name = "ga-parity"
version = "0.1.0"
edition = "2021"
publish = false
description = "Wormchain ↔ SVM accountant parity checker: compares balances and replay marks between a snapshot and the deployed program, with a JSONL ledger of every check."

[lib]
name = "ga_parity"
path = "src/lib.rs"

[[bin]]
name = "ga-parity"
path = "src/main.rs"

# Every dependency pinned exact, with a committed lockfile. Every version matches
# ga-backfill's already-audited dep set (see ../backfill/Cargo.toml).
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
hex = "=0.4.3"
anyhow = "=1.0.103"
clap = { version = "=4.5.50", features = ["derive"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "time"] }
solana-client = "=3.1.14"
solana-commitment-config = "=3.1.1"
solana-pubkey = { version = "=4.2.0", features = ["curve25519"] }
sha2 = "=0.10.9"
bytemuck = "=1.25.2"
# `HttpSender` with a custom `reqwest::Client`, for the `--origin` header.
# Both already resolved transitively at these exact versions.
solana-rpc-client = "=3.1.14"
reqwest = { version = "=0.12.28", default-features = false }

# Path deps: snapshot reader + reconcile primitives, and the on-chain layout
# constants. One parser, one layout source.
ga-backfill = { path = "../backfill" }
global-accountant-definitions = { path = "../../crates/definitions" }

[dev-dependencies]
tempfile = "=3.14.0"
