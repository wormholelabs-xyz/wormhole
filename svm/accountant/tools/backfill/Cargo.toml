[package]
name = "svm-accountant-backfill"
version = "0.1.0"
edition = "2021"
publish = false
description = "Off-chain orchestrator for the wormchain → SVM Global Accountant migration: reads the snapshot and drives the backfill program at scale."

[lib]
name = "svm_accountant_backfill"
path = "src/lib.rs"

[[bin]]
name = "svm-accountant-backfill"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bincode.workspace = true
bytemuck.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
solana-address.workspace = true
solana-client.workspace = true
solana-commitment-config.workspace = true
solana-hash.workspace = true
solana-instruction.workspace = true
solana-keypair.workspace = true
# Exact wire-size probing: the batcher measures a real serialized `Transaction`.
solana-message.workspace = true
solana-pubkey.workspace = true
solana-signer.workspace = true
solana-transaction.workspace = true
solana-transaction-error.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

svm-accountant-tools-common.workspace = true
# Program crates for the instruction discriminators and the backfill authorities.
global-accountant-definitions.workspace = true
global-accountant-backfill.workspace = true
ntt-global-accountant-backfill.workspace = true

[dev-dependencies]
base64.workspace = true
svm-accountant-tools-common = { workspace = true, features = ["test-support"] }
solana-signature.workspace = true
tempfile.workspace = true
