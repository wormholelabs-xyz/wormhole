[workspace]
# Standalone workspace — keeps deps isolated from the parent SBF workspace
# (mirrors `tools/wormchain-snapshot/`).

[package]
name = "ga-backfill"
version = "0.1.0"
edition = "2021"
publish = false
description = "Off-chain orchestrator for the wormchain → SVM Global Accountant migration: reads the snapshot catalogue and drives the backfill program at scale."

[lib]
name = "ga_backfill"
path = "src/lib.rs"

[[bin]]
name = "ga-backfill"
path = "src/main.rs"

# Balance-reconciliation tool (see `just reconcile-ntt|wtt`). Kept out of
# `src/bin/` because the repo `.gitignore` excludes any `bin` directory.
[[bin]]
name = "reconcile_balances"
path = "src/reconcile_balances.rs"

# Per CLAUDE.md: every dependency pinned exact. Versions chosen to match the
# snapshot tool's already-audited dep set where overlap exists.
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
hex = "=0.4.3"
thiserror = "=1.0.69"
clap = { version = "=4.5.50", features = ["derive"] }
anyhow = "=1.0.102"

# Async submitter (Phase 4). Pinned exact; versions match what the operational
# program's Cargo.lock resolves to.
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
solana-client = "=3.1.14"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.0"
solana-transaction = "=3.1.0"
solana-commitment-config = "=3.1.1"
solana-hash = "=3.1.0"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }

# Solana SDK pieces for tx building. Versions match what the operational
# program's Cargo.lock resolves to, pinned exact per CLAUDE.md.
solana-pubkey = { version = "=4.2.0", features = ["curve25519"] }
solana-instruction = "=3.4.0"
solana-address = { version = "=2.6.0", features = ["curve25519"] }
# Exact wire-size probing for the chunker's packet-limit bound (fix #1 in the
# backfill hardening pass): building a throwaway `Message`/`Transaction` and
# measuring its real serialized length reuses the actual short_vec-encoded
# wire format instead of a hand-derived byte-counting formula. Already
# resolved transitively (via solana-client / solana-transaction) at the exact
# versions pinned below — promoting to a direct dependency, not a fresh
# resolution.
solana-message = "=3.1.0"
bincode = "=1.3.3"
# Catalogue content-hash for the cursor's resume identity check (`run`
# subcommand). Already resolved transitively at this exact version.
sha2 = "=0.10.9"

# Path deps to share program-level constants (instruction discriminators,
# PDA seed prefixes, layout sizes). Host-buildable — both the program and
# definitions crates have working host targets used by their own mollusk
# tests.
global-accountant-definitions = { path = "../../crates/definitions" }
global-accountant-backfill = { path = "../../programs/global-accountant-backfill", default-features = false }
ntt-global-accountant-backfill = { path = "../../programs/ntt-global-accountant-backfill", default-features = false }

[dev-dependencies]
tempfile = "=3.14.0"
# Test-only: hand-rolled mock JSON-RPC server for `tests/submitter.rs`'s
# orchestration tests. Both already sit in the resolved dependency graph
# transitively (via solana-client / the base64 encoding the operational
# program's tests already pin), so pinning them directly here does not
# change what's actually being built — see Cargo.lock.
solana-signature = "=3.4.1"
base64 = "=0.22.1"
